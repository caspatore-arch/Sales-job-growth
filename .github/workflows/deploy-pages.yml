name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - claude/tony-techs-init-h57ofk
    paths-ignore:
      - media-manifest.json
      - raw-media/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # no `environment:` block — the auto-created github-pages environment's
  # branch policy only allows the branch that first enabled Pages, and
  # declaring the environment gets this branch rejected at job start.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /Sales-job-growth/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
